name: PR Validation Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla (Checkout code)
        uses: actions/checkout@v4

      - name: Node.js Kurulumu (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle (Install Dependencies)
        run: npm ci

      - name: Tüm Validatör Zinciri (commands + search + tasks + brand)
        run: npm run validate

      - name: Next.js Proje Build Testi (Build Project)
        run: npm run build
